<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRANS TIME · News Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f7;--panel:#fff;--ink:#0f1b2d;--muted:#5b6678;--line:#dde1e8;
  --brand:#1747d6;--brand-ink:#fff;--accent:#f2b705;--stage:#e3e6ec;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c121c;--panel:#151d2b;--ink:#eef1f6;--muted:#9aa5b8;--line:#263146;
  --brand:#5b86ff;--brand-ink:#0c121c;--stage:#0a0f17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c121c;--panel:#151d2b;--ink:#eef1f6;--muted:#9aa5b8;--line:#263146;--brand:#5b86ff;--brand-ink:#0c121c;--stage:#0a0f17;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Kanit,"Noto Sans Thai",system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.mark{background:var(--ink);color:var(--bg);font-weight:600;padding:2px 10px;border-radius:6px;letter-spacing:.04em}
header h1{font-size:1.05rem;font-weight:500;margin:0}
header p{margin:0 0 0 auto;color:var(--muted);font-size:.9rem}
.app{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:20px;max-width:1200px;margin:0 auto;padding:20px}
.stage{position:sticky;top:20px;align-self:start;background:var(--stage);border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.canvas-wrap{width:100%;display:flex;justify-content:center}
canvas{max-width:100%;max-height:calc(100vh - 190px);height:auto;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.25);touch-action:none;cursor:grab;background:#222}
canvas.drag{cursor:grabbing}
.hint{margin:0;color:var(--muted);font-size:.85rem;text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 18px 18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -18px 14px;padding:0 12px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:14px 6px 10px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--brand)}
.sec{display:none}.sec.on{display:block}
label.t{display:block;font-weight:500;margin:14px 0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chip{border:1.5px solid var(--line);background:none;border-radius:10px;padding:8px 14px;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent);font-weight:500}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed var(--line);border-radius:14px;padding:26px 12px;text-align:center;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,transparent)}
.drop b{font-weight:500;font-size:1.05rem}.drop small{color:var(--muted)}
textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);resize:vertical;min-height:84px}
.row{display:flex;align-items:center;gap:12px}
.row input[type=range]{flex:1;height:32px;accent-color:var(--brand)}
.row output{min-width:56px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.sw:first-of-type{border-top:0}
.sw input{width:22px;height:22px;accent-color:var(--brand)}
input[type=color]{width:44px;height:36px;border:1.5px solid var(--line);border-radius:8px;background:none;padding:2px}
.link{background:none;border:0;color:var(--brand);cursor:pointer;padding:6px 0;text-decoration:underline}
.cta{position:sticky;bottom:0;margin:18px -18px -18px;padding:14px 18px;background:var(--panel);border-top:1px solid var(--line);border-radius:0 0 16px 16px}
.dl{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:1.05rem;cursor:pointer}
.dl:active{transform:scale(.98)}
.cta p{margin:8px 0 0;color:var(--muted);font-size:.82rem;text-align:center}
#save{display:none;margin-top:12px;text-align:center}
#save img{max-width:100%;border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){
  .app{grid-template-columns:1fr;padding:12px}
  .stage{position:static;padding:12px}
  canvas{max-height:56vh}
  header p{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <span class="mark">TRANS TIME</span>
  <h1>News Studio</h1>
  <p>ทำภาพข่าวได้ใน 3 ขั้นตอน</p>
</header>

<main class="app">
  <section class="stage" aria-label="ภาพตัวอย่าง">
    <div class="canvas-wrap"><canvas id="cv" width="1080" height="1350" aria-label="ภาพตัวอย่างภาพข่าว ลากเพื่อเลื่อนรูป"></canvas></div>
    <p class="hint" id="hint">ลากบนภาพเพื่อเลื่อนรูป · <span id="dim">1080 × 1350 px</span></p>
  </section>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-t="a">1 · ภาพ</button>
      <button class="tab" role="tab" aria-selected="false" data-t="b">2 · ข้อความ</button>
      <button class="tab" role="tab" aria-selected="false" data-t="c">3 · ปรับแต่ง</button>
    </div>

    <div class="sec on" id="a">
      <label class="t">ขนาดภาพ</label>
      <div class="seg" id="ratio">
        <button aria-pressed="true" data-w="1080" data-h="1350">แนวตั้ง 4:5</button>
        <button aria-pressed="false" data-w="1080" data-h="1080">จัตุรัส 1:1</button>
        <button aria-pressed="false" data-w="1920" data-h="1080">แนวนอน 16:9</button>
      </div>
      <label class="t">รูปข่าว</label>
      <label class="drop" id="drop" for="file">
        <b>แตะเพื่อเลือกรูป หรือลากรูปมาวาง</b>
        <small>JPG, PNG, WebP · ประมวลผลในเครื่องของคุณ ไม่อัปโหลดขึ้นเซิร์ฟเวอร์</small>
      </label>
      <input id="file" type="file" accept="image/*" hidden>
      <div id="imgctl" style="display:none">
        <label class="t">ซูมรูป</label>
        <div class="row"><input id="zoom" type="range" min="100" max="300" value="100"><output id="zoomO">100%</output></div>
        <button class="link" id="resetPos">รีเซ็ตตำแหน่งรูป</button>
        <button class="link" id="clearImg" style="margin-left:14px">ล้างรูป</button>
      </div>
    </div>

    <div class="sec" id="b">
      <label class="t" for="head">พาดหัว</label>
      <textarea id="head" rows="4">ขนส่งฯ x สธ.
เปิดเกม
“ต่อใบขับขี่ออนไลน์”
เต็มรูปแบบ มิ.ย. 69</textarea>
      <div class="row"><input id="headS" type="range" min="40" max="140" value="100" aria-label="ขนาดพาดหัว"><output id="headSO">100 px</output></div>

      <label class="t" for="sub">หัวข้อรอง</label>
      <textarea id="sub" rows="2" placeholder="ไม่บังคับ เว้นว่างได้"></textarea>
      <div class="row"><input id="subS" type="range" min="24" max="100" value="52" aria-label="ขนาดหัวข้อรอง"><output id="subSO">52 px</output></div>
      <p class="hint" style="text-align:left;margin-top:8px">กด Enter เพื่อขึ้นบรรทัดใหม่ ข้อความที่ยาวเกินจะย่ออัตโนมัติให้พอดี</p>

      <label class="t">การจัดแนว</label>
      <div class="seg" id="align">
        <button aria-pressed="true" data-v="center">กึ่งกลาง</button>
        <button aria-pressed="false" data-v="left">ชิดซ้าย</button>
      </div>
    </div>

    <div class="sec" id="c">
      <label class="t">ความเข้มเงาหลังข้อความ</label>
      <div class="row"><input id="shade" type="range" min="0" max="100" value="70"><output id="shadeO">70%</output></div>
      <label class="t">เฟดสีไล่ด้านล่าง · ความเข้ม</label>
      <div class="row"><input id="colA" type="range" min="0" max="100" value="70" aria-label="ความเข้มเฟดสีไล่"><output id="colAO">70%</output></div>
      <label class="t">เฟดสีไล่ด้านล่าง · ความสูง</label>
      <div class="row"><input id="colH" type="range" min="10" max="100" value="45" aria-label="ความสูงเฟดสีไล่"><output id="colHO">45%</output></div>
      <label class="t">เฟดสีดำด้านล่าง · ความเข้ม</label>
      <div class="row"><input id="fadeA" type="range" min="0" max="100" value="50" aria-label="ความเข้มเฟดสีดำ"><output id="fadeAO">50%</output></div>
      <label class="t">เฟดสีดำด้านล่าง · ความสูง</label>
      <div class="row"><input id="fadeH" type="range" min="5" max="80" value="30" aria-label="ความสูงเฟดสีดำ"><output id="fadeHO">30%</output></div>
      <div style="margin-top:10px">
        <label class="sw"><span>แสดงโลโก้ TRANS TIME</span><input id="logo" type="checkbox" checked></label>
        <label class="sw"><span>แสดง transtimenews.co ด้านล่าง</span><input id="site" type="checkbox" checked></label>
        <label class="sw"><span>แสดงวันที่ด้านขวาบน</span><input id="date" type="checkbox"></label>
        <label class="sw"><span>ไล่สีด้านล่าง</span><input id="bar" type="checkbox" checked></label>
        <label class="sw"><span>สีซ้าย</span><input id="c1" type="color" value="#00008c"></label>
        <label class="sw"><span>สีขวา</span><input id="c2" type="color" value="#00e5e5"></label>
      </div>
    </div>

    <div class="cta">
      <button class="dl" id="dl">ดาวน์โหลดภาพ PNG</button>
      <p>ความละเอียดเต็ม · ตัวอักษรคมชัด</p>
      <div id="save"><p>หากดาวน์โหลดไม่เริ่ม ให้แตะภาพด้านล่างค้างไว้เพื่อบันทึก</p><img id="saveImg" alt="ภาพ PNG สำหรับบันทึก"></div>
    </div>
  </section>
</main>
<div id="toast" role="status"></div>

  function draw(){
    var W=S.w,H=S.h,k=Math.min(W,H)/1080;
    cv.width=W;cv.height=H;
    $('dim').textContent=W+' × '+H+' px';
    ctx.fillStyle='#1b2433';ctx.fillRect(0,0,W,H);
    if(S.img){
      var sc=Math.max(W/S.img.width,H/S.img.height)*S.zoom;
      var iw=S.img.width*sc,ih=S.img.height*sc;
      var mx=(iw-W)/2,my=(ih-H)/2;
      var x=-mx+S.ox*W,y=-my+S.oy*H;
      ctx.drawImage(S.img,x,y,iw,ih);
    }else{
      ctx.fillStyle='#8896ad';ctx.textAlign='center';ctx.font='500 '+(44*k)+'px Kanit, sans-serif';
      ctx.fillText('เลือกรูปข่าวที่แท็บ “ภาพ”',W/2,H*0.4);
    }
    var sh=$('shade').value/100;
    var dk=ctx.createLinearGradient(0,H*0.35,0,H*0.8);
    dk.addColorStop(0,'rgba(5,8,20,0)');dk.addColorStop(1,'rgba(5,8,20,'+(0.55*sh)+')');
    ctx.fillStyle=dk;ctx.fillRect(0,H*0.35,W,H*0.65);
    var fa=$('fadeA').value/100,fh=$('fadeH').value/100;
    if(fa>0){
      var fg=ctx.createLinearGradient(0,H*(1-fh),0,H);
      fg.addColorStop(0,'rgba(0,0,0,0)');fg.addColorStop(1,'rgba(0,0,0,'+fa+')');
      ctx.fillStyle=fg;ctx.fillRect(0,H*(1-fh),W,H*fh);
    }
    if($('bar').checked){
      var o=document.createElement('canvas');o.width=W;o.height=H;var oc=o.getContext('2d');
      var gx=oc.createLinearGradient(0,0,W,0);gx.addColorStop(0,$('c1').value);gx.addColorStop(1,$('c2').value);
      oc.fillStyle=gx;oc.fillRect(0,0,W,H);
      oc.globalCompositeOperation='destination-in';
      var ca=$('colA').value/100,ch=$('colH').value/100;
      var gy=oc.createLinearGradient(0,H*(1-ch),0,H);gy.addColorStop(0,'rgba(0,0,0,0)');gy.addColorStop(1,'rgba(0,0,0,'+ca+')');
      oc.fillStyle=gy;oc.fillRect(0,0,W,H);
      ctx.drawImage(o,0,0);
    }
    var m=W*0.07,al=S.align,tx=al==='center'?W/2:m,maxW=W-m*2;
    ctx.textBaseline='alphabetic';
    if($('logo').checked&&LG.complete&&LG.naturalWidth){
      ctx.drawImage(LG,40*k,50*k,LG.naturalWidth*k,LG.naturalHeight*k);
    }
    if($('date').checked){
      var d=new Date().toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
      ctx.font='400 '+(28*k)+'px Kanit, sans-serif';ctx.fillStyle='#fff';ctx.textAlign='right';
      ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=8*k;
      ctx.fillText(d,W-40*k,90*k);ctx.shadowBlur=0;
    }
    var y=H-($('site').checked?112:60)*k;
    var hl=$('head').value.split('\n').filter(function(s){return s.trim()}).slice(0,4);
    var sl=$('sub').value.split('\n').filter(function(s){return s.trim()}).slice(0,4);
    var hs=fitLines(hl,'',$('headS').value*k,maxW,500);
    var ss=fitLines(sl,'',$('subS').value*k,maxW,400);
    ctx.textAlign=al;ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=12*k;ctx.fillStyle='#fff';
    ctx.font='400 '+ss+'px Kanit, sans-serif';
    for(var i=sl.length-1;i>=0;i--){ctx.fillText(sl[i],tx,y);y-=ss*1.3}
    if(sl.length)y-=ss*0.25;
    ctx.font='500 '+hs+'px Kanit, sans-serif';
    for(var j=hl.length-1;j>=0;j--){ctx.fillText(hl[j],tx,y);y-=hs*1.22}
    ctx.shadowBlur=0;
    if($('site').checked){
      ctx.font='500 '+(22*k)+'px Kanit, sans-serif';ctx.fillStyle='#fff';
      ctx.fillText('transtimenews.co',tx,H-30*k);
    }
  }
  var raf;function redraw(){cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)}

  // tabs
  document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-selected',x===b)});
    document.querySelectorAll('.sec').forEach(function(s){s.classList.toggle('on',s.id===b.dataset.t)});
  }});
  // segmented
  function seg(id,fn){document.querySelectorAll('#'+id+' button').forEach(function(b){b.onclick=function(){
    document.querySelectorAll('#'+id+' button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});fn(b);redraw()}})}
  seg('ratio',function(b){S.w=+b.dataset.w;S.h=+b.dataset.h;S.ox=S.oy=0});
  seg('align',function(b){S.align=b.dataset.v});
  // ranges with readouts
  [['headS','headSO',' px'],['subS','subSO',' px'],['shade','shadeO','%'],['zoom','zoomO','%'],['fadeA','fadeAO','%'],['fadeH','fadeHO','%'],['colA','colAO','%'],['colH','colHO','%']].forEach(function(r){
    $(r[0]).oninput=function(){$(r[1]).textContent=this.value+r[2];if(r[0]==='zoom')S.zoom=this.value/100;redraw()}});
  ['head','sub'].forEach(function(i){$(i).oninput=redraw});
  ['logo','site','date','bar','c1','c2'].forEach(function(i){$(i).oninput=redraw});

  // image load
  function load(f){
    if(!f||!/^image\//.test(f.type)){toast('กรุณาเลือกไฟล์รูปภาพ (JPG, PNG, WebP)');return}
    var im=new Image();im.onload=function(){S.img=im;S.ox=S.oy=0;S.zoom=1;$('zoom').value=100;$('zoomO').textContent='100%';
      $('imgctl').style.display='block';$('drop').querySelector('b').textContent='เปลี่ยนรูป';redraw();toast('ใส่รูปแล้ว · ไปแท็บ “ข้อความ” ได้เลย')};
    im.src=URL.createObjectURL(f);
  }
  $('file').onchange=function(){load(this.files[0])};
  var dz=$('drop');
  ['dragover','dragenter'].forEach(function(e){dz.addEventListener(e,function(ev){ev.preventDefault();dz.classList.add('over')})});
  ['dragleave','drop'].forEach(function(e){dz.addEventListener(e,function(){dz.classList.remove('over')})});
  dz.addEventListener('drop',function(ev){ev.preventDefault();load(ev.dataTransfer.files[0])});
  $('resetPos').onclick=function(){S.ox=S.oy=0;redraw()};
  $('clearImg').onclick=function(){S.img=null;$('imgctl').style.display='none';$('drop').querySelector('b').textContent='แตะเพื่อเลือกรูป หรือลากรูปมาวาง';$('file').value='';redraw()};

  // drag to pan
  var drag=null;
  cv.addEventListener('pointerdown',function(e){if(!S.img)return;drag={x:e.clientX,y:e.clientY,ox:S.ox,oy:S.oy};cv.setPointerCapture(e.pointerId);cv.classList.add('drag')});
  cv.addEventListener('pointermove',function(e){if(!drag)return;var r=cv.getBoundingClientRect();
    S.ox=drag.ox+(e.clientX-drag.x)/r.width;S.oy=drag.oy+(e.clientY-drag.y)/r.height;redraw()});
  ['pointerup','pointercancel'].forEach(function(n){cv.addEventListener(n,function(){drag=null;cv.classList.remove('drag')})});

  // download
  $('dl').onclick=function(){
    draw();
    cv.toBlob(function(b){
      if(!b){toast('สร้างภาพไม่สำเร็จ ลองใหม่อีกครั้ง');return}
      var u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u;a.download='transtime-news-'+Date.now()+'.png';document.body.appendChild(a);a.click();a.remove();
      $('saveImg').src=u;$('save').style.display='block';
      toast('ดาวน์โหลดแล้ว');
    },'image/png');
  };

  var fl=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('500 40px Kanit'),document.fonts.load('400 40px Kanit'),document.fonts.load('600 40px Kanit')]):Promise.resolve();
  fl.then(draw,draw);draw();
})();
</script>
</body>
</html>
